name: android-apk

on:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=false
        -Dorg.gradle.workers.max=2
        -Dorg.gradle.internal.http.connectionTimeout=30000
        -Dorg.gradle.internal.http.socketTimeout=30000
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Report build environment
        working-directory: android-app
        run: |
          set -euxo pipefail
          java -version
          gradle --version
      - name: Build debug APK
        working-directory: android-app
        timeout-minutes: 10
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 9m \
            gradle --no-daemon --console=plain --stacktrace --info :app:assembleDebug \
            2>&1 | tee /tmp/vibe-gradle-build.log
      - name: Upload Gradle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-gradle-diagnostics
          path: /tmp/vibe-gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify APK exists and is a ZIP/APK
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path('android-app/app/build/outputs/apk/debug/app-debug.apk')
          with ZipFile(apk) as z:
              names = set(z.namelist())
              required = {'AndroidManifest.xml', 'classes.dex'}
              missing = required - names
              if missing:
                  raise SystemExit(f'APK missing required entries: {sorted(missing)}')
              print(f'APK verified: {apk} ({apk.stat().st_size} bytes, {len(names)} entries)')
          PY
          sha256sum "$APK"
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vibe-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build, install, launch, and exercise live service
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            cd android-app
            gradle --no-daemon --console=plain :app:assembleDebug
            APK=app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb shell cmd package resolve-activity --brief com.vibe.app > /tmp/vibe-resolved.txt
            cat /tmp/vibe-resolved.txt
            adb logcat -c
            adb shell am start -W -n com.vibe.app/.MainActivity > /tmp/vibe-launch.txt
            cat /tmp/vibe-launch.txt
            sleep 2
            adb shell pidof -s com.vibe.app > /tmp/vibe-pid.txt
            cat /tmp/vibe-pid.txt
            adb shell dumpsys activity activities | grep -F 'com.vibe.app/.MainActivity'
            adb shell am start-foreground-service -n com.vibe.app/.LiveTestService -a com.vibe.app.START
            sleep 2
            adb shell dumpsys activity services com.vibe.app > /tmp/vibe-services.txt
            cat /tmp/vibe-services.txt
            grep -F 'LiveTestService' /tmp/vibe-services.txt
            adb shell am startservice -n com.vibe.app/.LiveTestService -a com.vibe.app.MARK_ISSUE
            adb shell am startservice -n com.vibe.app/.LiveTestService -a com.vibe.app.SNAPSHOT
            adb shell am startservice -n com.vibe.app/.LiveTestService -a com.vibe.app.PAUSE_RESUME
            adb shell am startservice -n com.vibe.app/.LiveTestService -a com.vibe.app.STOP
            sleep 1
            adb shell dumpsys activity services com.vibe.app > /tmp/vibe-services-after-stop.txt
            cat /tmp/vibe-services-after-stop.txt
            if grep -Fq 'LiveTestService' /tmp/vibe-services-after-stop.txt; then
              echo 'LiveTestService still active after STOP' >&2
              exit 1
            fi
            adb logcat -b crash -d > /tmp/vibe-crash.txt
            cat /tmp/vibe-crash.txt
            if grep -E 'FATAL EXCEPTION|Process: com\.vibe\.app' /tmp/vibe-crash.txt; then
              echo 'Vibe crash detected' >&2
              exit 1
            fi
      - name: Upload emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-emulator-smoke-evidence
          path: |
            /tmp/vibe-resolved.txt
            /tmp/vibe-launch.txt
            /tmp/vibe-pid.txt
            /tmp/vibe-services.txt
            /tmp/vibe-services-after-stop.txt
            /tmp/vibe-crash.txt
          if-no-files-found: ignore
          retention-days: 7
