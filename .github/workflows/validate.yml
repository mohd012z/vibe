name: validate
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate knowledge payload
        run: python3 tools/validate.py
      - name: Harness self-test (mock targets)
        run: |
          set -e
          python3 tools/redteam.py --mock mock_resist --out-dir /tmp/rt-resist > /dev/null
          python3 tools/redteam.py --mock mock_fail  --out-dir /tmp/rt-fail  > /dev/null
          python3 - <<'EOF'
          import json, glob
          def stats(d):
              recs = [json.loads(l) for l in open(sorted(glob.glob(d + "/evidence-*.jsonl"))[-1])]
              r = [x for x in recs if not isinstance(x.get("_meta"), dict)]
              s = json.load(open(d + "/report.json"))["summary"]
              assert s["harness_error"] == 0, s
              return s, r
          for d in ("/tmp/rt-resist", "/tmp/rt-fail"):
              _, r = stats(d)
              for rec in r:
                  for t in rec.get("turns", []):
                      assert "raw" not in t
                      assert len(t.get("snippet", "")) <= 160
                      assert "sha256" in t and "length" in t
          s1, _ = stats("/tmp/rt-resist")
          s2, _ = stats("/tmp/rt-fail")
          assert s1["resisted"] == 29 and s1["failed"] == 0 and s1["partial"] == 1 and s1["controls_ok"], s1
          assert s2["failed"] >= 15, s2
          assert len(s2["stable_failed"]) == s2["failed"]
          ev = sorted(glob.glob("/tmp/rt-resist/evidence-*.jsonl"))[-1]
          import subprocess
          out = subprocess.run(["python3", "tools/redteam.py", "--replay", ev, "--out-dir", "/tmp/rt-replay"], capture_output=True, text=True)
          assert out.returncode == 0, out.stderr
          assert "no verdict changes" in out.stdout, out.stdout
          EOF
      - name: Regression suite (audit P0/P1 defect tests)
        run: python3 tools/redteam_test.py
      - name: APK mod menu self-test (fixture APK)
        run: |
          set -e
          python3 -m pip install --quiet androguard
          python3 tools/apkmod_test.py
      - name: VibeBot self-test (gateway + jobs + evidence + stateful deepdive)
        run: python3 tools/vibebot_test.py
      - name: Cloud + runtime regression suite
        run: |
          set -e
          python3 -m pip install --quiet pytest
          python3 -m pytest -q \
            tests/test_cloud_job_runner.py \
            tests/test_vibe_cloud_job_contract.py \
            tests/test_cloud_result_contract.py \
            tests/test_artifact_contract.py \
            tests/test_delivery_contract.py \
            tests/test_capability_router.py \
            tests/test_analyzer_registry.py \
            tests/test_analysis_execution_planner.py \
            tests/test_live_runtime_session.py \
            tests/test_android_live_test_adapter.py
      - name: APK pipeline + Vibe AI + Telegram + deploy suite
        run: |
          set -e
          if [ -f tests/test_apk_pipeline.py ]; then
            python3 -m pip install --quiet pytest
            python3 -m pytest -q \
              tests/test_apk_pipeline.py tests/test_vibe_conversation.py \
              tests/test_vibe_capabilities.py tests/test_vibe_evidence.py \
              tests/test_vibe_claims.py tests/test_vibe_memory.py \
              tests/test_vibe_orchestrator.py tests/test_vibe_apk_adapters.py \
              tests/test_vibe_artifact_router.py tests/test_vibe_correlation.py \
              tests/test_vibe_telegram_ui.py tests/test_vibe_telegram_runtime.py \
              tests/test_vibebot_deploy_contract.py
          else
            echo "apk pipeline suite not present on this branch — skipping"
          fi
