name: validate
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate knowledge payload
        run: python3 tools/validate.py
      - name: Harness self-test (mock targets)
        run: |
          set -e
          python3 tools/redteam.py --mock mock_resist --out-dir /tmp/rt-resist > /dev/null
          python3 tools/redteam.py --mock mock_fail --out-dir /tmp/rt-fail > /dev/null
      - name: Regression suite (audit P0/P1 defect tests)
        run: python3 tools/redteam_test.py
      - name: APK mod menu self-test (fixture APK)
        run: |
          python3 -m pip install --quiet androguard
          python3 tools/apkmod_test.py
      - name: VibeBot self-test
        run: python3 tools/vibebot_test.py
      - name: Cloud + runtime regression suite
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q \
            tests/test_cloud_job_runner.py tests/test_vibe_cloud_job_contract.py \
            tests/test_cloud_result_contract.py tests/test_artifact_contract.py \
            tests/test_delivery_contract.py tests/test_capability_router.py \
            tests/test_analyzer_registry.py tests/test_analysis_execution_planner.py \
            tests/test_live_runtime_session.py tests/test_android_live_test_adapter.py \
            tests/test_android_live_ui_provider.py
      - name: Native Android shell contract
        run: python3 -m pytest -q tests/test_native_android_shell_contract.py
      - name: APK pipeline + Vibe AI + Telegram + deploy suite
        run: |
          if [ -f tests/test_apk_pipeline.py ]; then
            python3 -m pytest -q \
              tests/test_apk_pipeline.py tests/test_vibe_conversation.py \
              tests/test_vibe_capabilities.py tests/test_vibe_evidence.py \
              tests/test_vibe_claims.py tests/test_vibe_memory.py \
              tests/test_vibe_orchestrator.py tests/test_vibe_apk_adapters.py \
              tests/test_vibe_artifact_router.py tests/test_vibe_correlation.py \
              tests/test_vibe_telegram_ui.py tests/test_vibe_telegram_runtime.py \
              tests/test_vibebot_deploy_contract.py
          fi
