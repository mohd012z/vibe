name: R2AI Studio Android verification
on:
  workflow_dispatch:
  push:
    branches:
      - feature/r2ai-studio-offline-m14
    paths:
      - 'android/r2ai-studio/**'
      - '.github/workflows/r2ai-studio-verify.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android/r2ai-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 using runner command-line tools
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Resolve Android dependencies
        run: gradle --no-daemon :app:dependencies --configuration debugCompileClasspath --stacktrace
      - name: Compile Android Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin --stacktrace
      - name: Run Android unit tests and assemble APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Check APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK signing and ZIP alignment
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
      - name: APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r2ai-studio-debug-apk
          path: |
            android/r2ai-studio/app/build/outputs/apk/debug/app-debug.apk
            android/r2ai-studio/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
