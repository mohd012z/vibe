plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vibe.hermesinspector'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vibe.hermesinspector'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
